# Keep PipeWire's hands off the microphone AIA owns.
#
# Installed by `./scripts/setup-echo-cancel.sh` to
# ~/.config/wireplumber/wireplumber.conf.d/.
#
# ── The failure this exists for ──────────────────────────────────────────
#
# AIA opens the TI PCM2902 directly through ALSA (`hw:3,0`), and an ALSA
# capture device allows exactly one reader. PipeWire does not know that, so it
# enumerates the same capsule, makes it a source, and — the moment anything
# captures from it — holds it open. AIA then cannot have it, and the assistant
# exits with:
#
#     cannot open the microphone: the microphone matching 'USB PnP Sound
#     Device' exists but could not be opened — it is almost certainly already
#     in use.
#
# `Restart=on-failure` then turns that into a loop: measured at nine restarts
# in the first two minutes after a reboot, with the device never once
# listening.
#
# What made it fire was the echo canceller. `capture.props.node.target` names
# the Brio, but at boot the USB camera has not enumerated yet, so the target
# does not resolve and PipeWire links the stream to whatever the **default
# source** is — which was the TI. The canceller then held AIA's microphone open
# for the life of the session, cancelling echo out of the wrong capsule.
#
# Two things were wrong and this file fixes the more fundamental one. Even
# without a canceller, PipeWire and AIA both managing one exclusive capture
# device is a race waiting for a slow boot; it had simply never been tested,
# because before this the services were not starting at boot at all.
#
# ── Why disabling rather than de-prioritising ────────────────────────────
#
# Nothing on this device wants the TI through PipeWire. AIA takes it directly,
# the video call takes the Brio, and the assistant's own output goes to HDMI.
# A device nobody should touch is better removed from the graph than left in it
# at low priority, where the next thing to ask for "a microphone" finds it.

monitor.alsa.rules = [
    {
        matches = [
            # By the stable ALSA id, which carries the vendor and product
            # strings rather than a card number. Card 3 today; card numbers
            # move when USB devices are replugged, and this must not.
            { device.name = "alsa_card.usb-C-Media_Electronics_Inc._USB_PnP_Sound_Device-00" }
        ]
        actions = {
            update-props = {
                device.disabled = true
            }
        }
    }
    {
        # Belt and braces: if the device rule is ever bypassed, the node itself
        # is still refused. Matching is a regex here (`~`), because the node
        # name gains a profile suffix the device name does not have.
        matches = [
            { node.name = "~alsa_input.usb-C-Media_Electronics_Inc._USB_PnP_Sound_Device.*" }
        ]
        actions = {
            update-props = {
                node.disabled = true
            }
        }
    }
]
