# Echo cancellation for the video call, in the audio graph rather than the
# browser.
#
# Install on the Pi with `./scripts/setup-echo-cancel.sh`, which copies this to
# ~/.config/pipewire/pipewire.conf.d/ and restarts PipeWire.
#
# ── Why this exists ──────────────────────────────────────────────────────
#
# Chromium's own canceller is enabled and does not work on this device.
# Measured during a real call, twice, thirty seconds apart:
#
#     aec=true ns=true agc=true rate=48000 erl=-30.0 erle=0.2
#
# `erle` is echo-return-loss-enhancement: how much of the speaker signal the
# canceller removes from the microphone, in dB. Tens of dB is healthy. 0.2 dB
# is a canceller that is running and achieving nothing, and it did not improve
# with time, so it is not a matter of convergence.
#
# The negative `erl` says why: the microphone signal is about 30 dB stronger
# than the reference Chromium is subtracting, which is what it looks like when
# the two cannot be aligned. A browser has to *estimate* the delay between
# handing audio to the system and hearing it come back through the room, and
# on this device that path is Chromium -> PipeWire -> HDMI -> speaker -> air ->
# Brio -> PipeWire -> Chromium. HDMI sinks buffer deeply, and the Brio runs on
# its own USB clock while the sink runs on the display clock, so the two drift.
# AEC3's delay search cannot hold that.
#
# PipeWire has no such problem: it is the graph. It knows exactly which samples
# it sent to the sink and when, so the reference is aligned by construction
# rather than by search, and it resamples across the two clock domains anyway.
#
# ── The virtual sink has to become the default, and here is why ──────────
#
# The first attempt deliberately left the default sink alone, on the theory
# that the call could opt in by itself: capture from `aipi5_call_mic`, and
# point the remote audio element at `aipi5_call_speaker` with `setSinkId`.
# Everything else, Piper included, would keep going straight to HDMI.
#
# That does not work, and the reason is only visible in the live graph:
# **Chromium opens more than one playback stream**, and `setSinkId` moves only
# the one attached to that element. The other carries no target and follows the
# default sink. Measured during a real call:
#
#     Chromium:output_FL |-> aipi5_call_speaker:playback_FL          (cancelled)
#     Chromium:output_FL |-> alsa_output...hdmi.hdmi-stereo:playback_FL  (not)
#
# So the caller's voice reached the speaker twice: once through the canceller,
# once around it. A canceller subtracts what *it* played, so the second path is
# echo it can never remove — and the result sounds exactly like cancellation
# not working at all, which is what it was.
#
# `scripts/setup-echo-cancel.sh` therefore also makes this sink the default.
# That cannot silence the device — the canceller forwards its playback straight
# to HDMI, so anything audible before still is — and `--remove` restores HDMI.
# The assistant's own speech now passes through the canceller too, which costs
# nothing: it has no echo to remove from a microphone AIA is not using, and it
# is forwarded unchanged.
#
# `node.passive` on both ends means the underlying devices are not held open
# while nothing is using the virtual ones — without it this would keep the Brio
# microphone claimed permanently, which is exactly the sort of quiet
# resource-holding the rest of this project works to avoid.

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            # The WebRTC canceller, which is the one already installed here as
            # libspa-aec-webrtc.so. `aec/libspa-aec-null` is a passthrough and
            # exists for testing that the routing works before blaming the
            # cancellation.
            library.name = aec/libspa-aec-webrtc

            # Named by their stable PipeWire node names, which carry the Brio's
            # serial and the HDMI card's platform path — not card numbers,
            # which move when USB devices are replugged.
            # `node.dont-reconnect` is the line that stops this eating the
            # assistant, and it was learned the hard way.
            #
            # At boot the Brio has not enumerated when PipeWire loads its
            # modules, so this target does not resolve — and a PipeWire stream
            # whose target is missing does not fail, it links to the **default
            # source** instead. That was AIA's TI microphone, which allows one
            # reader; the canceller held it for the session, AIA could not open
            # it, and the assistant restarted nine times in two minutes while
            # never once listening.
            #
            # With this set, a target that is not there yet means no link, not
            # the wrong link. The canceller connects when the Brio appears.
            capture.props = {
                target.object       = "alsa_input.usb-046d_Brio_101_2501APQAUK08-02.mono-fallback"
                node.dont-reconnect = true
                node.passive        = true
            }
            playback.props = {
                target.object       = "alsa_output.platform-107c701400.hdmi.hdmi-stereo"
                node.dont-reconnect = true
                node.passive        = true
            }

            # What the call page asks for by name. The descriptions are what
            # appear as device labels in the browser, so they are written to be
            # recognisable in `enumerateDevices` output.
            source.props = {
                node.name        = "aipi5_call_mic"
                node.description = "Brio 101 echo cancelled"
            }
            sink.props = {
                node.name        = "aipi5_call_speaker"
                node.description = "AIPI5 call speaker echo cancelled"
            }

            aec.args = {
                # The three the requirement asks for, applied here rather than
                # in the browser — the browser's copies stay on and become a
                # second, harmless pass over already-cancelled audio.
                webrtc.gain_control          = true
                webrtc.noise_suppression     = true
                webrtc.extended_filter       = true
                # The Brio sits inches from the speaker, so the echo arrives
                # loud and almost immediately. A longer filter costs CPU and
                # buys nothing at this distance.
                webrtc.delay_agnostic        = true
            }
        }
    }
]
