# AIPI5 — the settings a person changes.
#
# Everything about *voice* — the wake word, the microphone gains, the VAD
# thresholds, the STT model, the Piper voices — deliberately is NOT here. Those
# live in AIA's `aia/core/config.py`, where they were measured on this hardware,
# and this project reads them from there rather than restating them. Restating
# them is how two files come to disagree about which microphone gain is correct.
#
# What is here is what this project adds: a display of a different size, a
# location, a camera, a screen that goes away when nobody is in the room, and
# a language model reached over a network.

display:
  width: 1280
  height: 800
  # The UI is a local web page opened in Chromium. Loopback only: it shows a
  # transcript of everything said in the room and has no authentication, the
  # same reasoning AIA's :8090 page carries.
  #
  # Not 8090. AIA's own web UI has that port, and while the two assistants
  # cannot run at once — the microphone allows exactly one reader — a stopped
  # service that is merely `systemctl --user stop`ped comes back on the next
  # login and takes the port with it.
  host: 127.0.0.1
  port: 8092

location:
  city: San Jose
  state: CA
  zip: "95127"
  # 95127 is East San Jose (Alum Rock). Latitude and longitude rather than the
  # ZIP because every weather API wants coordinates and geocoding a ZIP at
  # startup is a network call that can fail on a device that boots before the
  # link is up.
  latitude: 37.3708
  longitude: -121.8163
  timezone: America/Los_Angeles
  units: fahrenheit          # fahrenheit | celsius

openai:
  # GPT-5.6 ships in three tiers and this device wants the cheapest one, for
  # reasons that are about latency as much as money. Priced per million tokens,
  # input/output:
  #
  #     gpt-5.6-sol     $5.00 / $30.00   flagship
  #     gpt-5.6-terra   $2.00 / $12.00   balanced — what the specification named
  #     gpt-5.6-luna    $0.20 /  $1.20   fastest and cheapest
  #
  # This assistant's conversational turn is small and shaped like the work Luna
  # is built for: a ~1,250-token cached prefix (the system prompt and the tool
  # schemas), a one-sentence question, five tools with enum-constrained
  # arguments, and a reply capped at about sixty words because everything said
  # here is read aloud. At roughly thirty turns a day that is about $0.65 a
  # month on Luna against $6.50 on Terra — and Luna supports vision and tool
  # calling, which are the only two capabilities this project needs beyond
  # plain text.
  #
  # Latency is the better argument. The model is on the *slow* path by design —
  # every known command is matched in about nine milliseconds and never reaches
  # it — so the API round trip is the whole of what a person waits for when
  # they ask an open question. Luna is the tier tuned for that.
  #
  # Move to terra if answers come back thin, particularly for bedtime stories,
  # which are the one thing here that is judged on prose rather than on being
  # correct and short. It is one line and costs about six dollars a month.
  model: gpt-5.6-luna
  # The vision request may use a different model than conversation does.
  # Empty means "the same one", which is the right answer here: describing a
  # room is a reasoning task rather than an OCR one, and reasoning is Luna's
  # strongest vision result rather than its weakest.
  vision_model: ""
  # A bound on a hang, not a target. The whole turn has a budget of a few
  # seconds and a request that has not answered in this long has already lost;
  # the user is told so rather than left listening to silence.
  timeout_s: 20.0
  vision_timeout_s: 30.0
  # Retries are for the network being briefly unavailable, not for a model
  # that refuses. Two attempts total.
  max_retries: 1
  # How much conversation is carried into the next request. Turns, not tokens:
  # a turn is what the user perceives, and the tokens follow from it. Each turn
  # is a user message and an assistant one, so 8 is 16 messages plus tools.
  context_turns: 8
  # Forget the thread entirely after this much silence. Somebody walking up to
  # the device an hour later is starting a new conversation, and carrying the
  # old one forward makes the first answer refer to something nobody said.
  context_idle_s: 600
  max_output_tokens: 400

weather:
  # Open-Meteo: no API key, no account, and no per-request quota to run out of
  # in the middle of a screensaver. The URL is configurable so a household with
  # a paid provider can point this elsewhere without a code change.
  provider: open-meteo
  # The screensaver redraws its clock every second and must not redraw its
  # weather every second with it. Ten minutes is well inside how fast the
  # weather actually changes and turns a day of screensaver into ~144 requests.
  cache_seconds: 600
  timeout_s: 8.0

news:
  # Local means local: these feeds are San Jose, Santa Clara County and the
  # wider Bay Area. Order matters only as a tiebreak — stories are interleaved
  # so one prolific feed cannot fill the whole answer.
  feeds:
    - https://news.google.com/rss/search?q=San+Jose+OR+%22Santa+Clara+County%22+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://www.mercurynews.com/location/california/bay-area/santa-clara-county/feed/
    - https://sanjosespotlight.com/feed/
  # Read out loud, not read. Three to five headlines with a sentence each is
  # about forty seconds of speech; ten would be three minutes and nobody
  # listens to the end of it.
  max_stories: 5
  cache_seconds: 900
  timeout_s: 8.0

story:
  # Bedtime stories are the one place this assistant talks for a long time on
  # purpose. Bounded anyway, because Piper synthesises a line at a time and an
  # unbounded story is an unbounded turn.
  default_minutes: 4
  max_minutes: 10

camera:
  enabled: true
  # A **Logitech BRIO 4K** on USB, not the CSI Camera Module 3 this was built
  # for, and not the Brio 101 that came before it. Card name "Logitech BRIO",
  # serial C26FB3A8 — `name_hint` is matched case-insensitively, so `Brio`
  # matches it.
  #
  # `auto` finds it by name and is the right answer on this device: /dev/video0
  # is not a stable identity — this Brio claims **four** nodes (two capture, two
  # metadata: /dev/video0-3, every one of them named "Logitech BRIO"), and their
  # numbers change with what else was plugged in at boot. The search keeps only
  # uvcvideo nodes whose sysfs `index` is 0, which on this camera is exactly
  # /dev/video0 — that filter is why a failed open costs 0.8 s instead of 81 s
  # on a Pi that enumerates twenty-two video nodes, eighteen of them the ISP and
  # the HEVC decoder. The same reasoning AIA applies to matching the microphone
  # by name rather than by card number.
  #
  # Put an explicit node here (/dev/video2, or a bare 2) to override the search
  # entirely; a named device is never second-guessed.
  device: auto
  name_hint: Brio
  # What the vision request is sent. Larger costs upload time on a domestic
  # connection and buys very little description quality.
  #
  # Modes this camera actually advertises, read off the device with
  # `v4l2-ctl --list-formats-ext` on 2026-08-17. **Three pixel formats: MJPG,
  # YUYV and NV12. No H.264.** Maximum frame rate per mode:
  #
  #            MJPG        YUYV / NV12
  #   640x480   120 fps      30 fps      <- AI Motion's gameplay mode
  #   1280x720   90 fps      30 fps      <- the mode below, the assistant's
  #   1920x1080  60 fps      30 fps
  #   3840x2160  30 fps      —
  #
  # Two changes from the Brio 101 this replaced, both worth knowing because the
  # old notes say otherwise: **YUYV 720p is no longer capped at 5 fps** (it does
  # a full 30 here — this camera is on a USB 3 port, so the uncompressed
  # bandwidth fits), and NV12 is new. MJPEG is still what the high frame rates
  # need, and `Camera._try_open` still asks for it explicitly.
  capture_width: 1280
  capture_height: 720
  # The stream rate, not the rate anything is looked at — the detector reads
  # twice a second and the vision question once when asked. It matters because
  # every read waits for one fresh frame rather than accepting a queued one, so
  # this is what a read costs: about 35 ms at 30 fps. See `Camera._read`.
  #
  # The assistant keeps 720p30 here for better low-light stills; the sensor
  # halves its own rate in a dim room whatever is asked for. AI Motion switches
  # the device to fixed 640x480 at 120 with two buffers while a game is open and
  # puts this mode back afterwards — see `aipi5/motion/camera_lease.py`. The two
  # want opposite things: a still wants pixels, a game wants the next frame.
  fps: 30
  jpeg_quality: 80
  # tmpfs. The Pi boots from flash and a capture-per-question write cycle is
  # both slower and unkind to the card — the same reasoning AIA's Piper scratch
  # directory carries.
  scratch: /dev/shm/aipi5-camera
  # How long to stream frames before trusting one. A USB camera's auto-exposure
  # only converges while buffers are being dequeued, so this is spent reading
  # and discarding rather than sleeping — a sleep would warm up nothing. Paid
  # once, at boot, where nobody is waiting on it.
  warmup_ms: 400

person_detection:
  enabled: true
  # hailo   — the AI HAT+ 2, which is the point of having one
  # cpu      — onnxruntime on the CPU, for a Pi with no accelerator
  # disabled — no presence detection; the screensaver then never engages
  backend: hailo
  # An absolute path into the `hailo-models` package rather than a file this
  # project downloads. The AI HAT+ 2 on this device is a **Hailo-10H**, not the
  # Hailo-8 or 8L the Pi AI Kit carries, and their HEFs are not interchangeable
  # — loading the wrong one fails at configure time with an architecture
  # mismatch. `hailo-all` already installs `_h10` variants, so the right model
  # is on the device before this project touches it.
  #
  # yolov8m rather than yolov8n: the nano model is not among the compiled h10
  # HEFs, and at two frames a second on an accelerator the difference between
  # medium and nano is not a cost anybody here can perceive. Only COCO class 0
  # (person) is read.
  model: /usr/share/hailo-models/yolov8m_h10.hef
  cpu_model: models/ssd_mobilenet_v1.onnx
  # Detections below this are not people.
  confidence: 0.45
  # How often a frame is looked at. Presence changes on the scale of somebody
  # walking across a room, so twice a second is generous and leaves the four
  # cores to the things with a latency budget.
  interval_ms: 500
  # Hysteresis. One frame must never move the UI: a person who blinks out of a
  # single frame has not left, and a curtain that moves has not arrived.
  # Asymmetric on purpose — arriving should feel instant, leaving should not be
  # jumpy, and these are tuned on the actual Pi.
  frames_to_appear: 2
  frames_to_disappear: 8

# The AI Motion pose service, shared by every body-motion game.
#
# Separate from person_detection although both run YOLO on the same
# accelerator: presence asks "is anybody there" twice a second forever, and
# this asks "where are their wrists" thirty times a second while somebody is
# playing. One section for both would need a confidence that means two things.
#
# Nothing here is held until a game is opened — no camera, no model, no thread.
motion:
  enabled: true
  # Ships with the `hailo-models` package and is compiled for HAILO10H, so
  # there is nothing to download. Its outputs are raw, unlike the detection
  # model next door, and `aipi5/motion/yolov8_pose.py` decodes them.
  pose_model: /usr/share/hailo-models/yolov8s_pose_h10.hef
  # Below this a detection is not a person.
  person_confidence: 0.5
  # Below this one joint is not trusted enough to steer a blade. Higher than
  # the person threshold on purpose: a confident person can still have an
  # uncertain wrist behind their back.
  keypoint_confidence: 0.45
  iou: 0.7
  # Weight on each new sample in the smoothing average. Measured: 0.55 settles
  # a step change in about four frames while removing the shiver at rest.
  # Lower adds lag you can feel by 0.3; higher stops smoothing much above 0.8.
  smoothing: 0.55
  # How long a wrist coasts on its last position once confidence drops, before
  # the hand is declared gone.
  stale_ms: 250
  # Logitech BRIO 4K gameplay capture. Superseded camera frames are discarded,
  # so a capture rate above the pose rate buys freshness rather than a queue:
  # the frame handed to the accelerator is at most half a capture period old.
  #
  # **Re-measured 2026-08-18 against every alternative worth trying**, with the
  # assistant stopped and a person in shot (`scripts/bench_motion.py`), as
  # capture-to-decoded-pose:
  #
  #   1280x720@90 MJPG    27.8 ms   46.3 pose fps   28% cpu   <- this one
  #   640x480@120 MJPG    26.5 ms   46.8 pose fps   21% cpu   4:3, see below
  #   1280x720@60 MJPG    30.1 ms   47.1 pose fps   22% cpu
  #   960x540@30  MJPG    21.5 ms   28.2 pose fps   10% cpu
  #   640x360@30  MJPG    21.6 ms   28.2 pose fps    5% cpu
  #   1280x720@30 NV12    30.9 ms   28.3 pose fps   16% cpu
  #   1280x720@30 YUYV    31.0 ms   28.3 pose fps   13% cpu
  #
  # The 30 fps rows look like the winners and are not. Their low figure is the
  # pose loop *waiting* for a camera slower than itself, so the frame is fresh
  # and then sits on screen for a whole 35 ms until the next one — mean
  # displayed staleness is latency plus half the update period, and on that
  # measure all six rows are within 2 ms of each other. What the fast modes
  # additionally buy is halving the gap between pose samples, which is what
  # collision segments and blade smoothness are made of. Repeated inside the
  # running system, with the browser drawing at 60 fps, 30 fps capture measured
  # *worse* end to end: 46.2 ms against 36.4 ms for this mode.
  #
  # 640x480@120 is 1.3 ms better and is not taken: the camera's 4:3 modes are a
  # horizontal crop, not a rescale, so it gives up a quarter of the field of
  # view — and the field of view is how far a player has to move their arms to
  # reach the edge of the screen.
  #
  # **640x480@120 is the mode in use**, chosen deliberately over 1280x720@90
  # after the sweep above: it is the fastest thing the camera offers, it is the
  # freshest frame (a capture period of 8.3 ms against 11.1), it needs no
  # downscale at all on the way into the model's 640-square, and it puts a
  # third more vertical pixels on the player than a 720p frame does once that
  # frame has been letterboxed down to 640x360.
  #
  # **The trade is the field of view, and it is a real one.** The camera's 4:3
  # modes are a horizontal *crop* of the 16:9 field, not a rescale — verified
  # by photographing one scene at both sizes — so it sees 75% of the width and
  # all of the height. A player therefore has to move their arms three quarters
  # as far to reach the edge of the screen, and has to stand slightly further
  # back to keep their whole body in shot.
  #
  # Nothing that *measures* the player is affected by that, and the reason is
  # `PersonPose.shaped()`: boxing, yoga and the crossed-arms gesture all work
  # in a fixed reference aspect, so every tuned constant in `boxing/config.py`
  # and `yoga/poses.py` keeps the meaning it was measured with. Without it a
  # true 45-degree limb reads 7.5 degrees differently here than at 16:9.
  capture_width: 640
  capture_height: 480
  capture_fps: 120
  # MJPG, YUYV or NV12. Only MJPG goes above 30 fps on this camera at any size
  # worth using; the JPEG decode it costs is paid on the capture thread, which
  # is not the thread gameplay is waiting on. 640x480 MJPG at 120 and 1280x720
  # MJPG at 90 are the only two modes above 30 fps that exist — 1280x720@120 is
  # not offered and a request for it negotiates down to 90.
  capture_format: MJPG
  target_fps: 30

games:
  enabled: true
  # Local, because game over must not need the network.
  scores: ~/.config/aipi5/game-scores.json
  # Touchscreen choices live separately from high scores. The five choices
  # are 60, 120, 180, 240 and 300 seconds; this is the first-run default.
  settings: ~/.config/aipi5/game-settings.json
  round_seconds: 120
  # The skeleton, the raw wrist coordinates and the frame timings, drawn over
  # the game. Off by default; the Settings page turns it on.
  debug: false
  sound: true

screensaver:
  enabled: true
  # From the moment presence is lost, not from the last frame seen. 60 s is
  # the specification's number and it is a config value because the right one
  # depends on the room.
  #
  # This is the *certain* case: the camera watched somebody leave. The other
  # case has its own number below.
  timeout_seconds: 60

  # Give the camera back while the screen is away, and take it again when the
  # screen comes back.
  #
  #     screensaver up   -> the detector parks, the Brio is released
  #     touch the screen -> the Brio reopens, the detector looks again
  #     nobody found in `wake_grace_seconds` -> screensaver, camera off again
  #
  # The reason is cost, not tidiness. Person detection is the only thing on this
  # device that reads the camera continuously — every 500 ms it is a USB
  # transfer, a JPEG decode and a Hailo inference — and none of that is worth
  # paying for a room with nobody in it and a screen nobody is looking at.
  #
  # **The trade: waking is a touch or a wake word, not walking up.** A closed
  # camera cannot see somebody arrive. The wake word still works, because the
  # microphone is never released, so "小艾同学" from across the room wakes the
  # screen exactly as a touch does. Set this to false to have presence take the
  # screensaver down by itself again, at the cost of the camera running all day.
  release_camera: true

  # How long the screen stays up after a touch woke it, before the camera not
  # having found anybody is allowed to take it away again. Five minutes, and
  # deliberately much longer than `timeout_seconds`: presence is UNKNOWN at that
  # moment rather than absent — the detector has observed nothing yet — and the
  # person who tapped may well be standing to one side of the panel, reading it,
  # outside the Brio's 78 degrees. A minute here would blank the screen in front
  # of somebody using it.
  wake_grace_seconds: 300

  # What the idle screen shows, and when. **This is the only place the
  # schedule is written down** — `aipi5/screensaver/schedule.py` reads it and
  # nothing else has an opinion — so the times can be moved here without
  # touching any screensaver logic.
  #
  #     07:00 – 21:00   the Google Photos slideshow
  #     21:01 – 06:59   the clock and the weather
  #
  # Inclusive start, and the night begins at 21:01 because 21:00 itself is a
  # daytime minute. The night window crosses midnight and is handled as the
  # complement of the day one, which is the only way that comparison is safe.
  #
  # The Pi's local time, always: `datetime.now()` reads /etc/localtime, so
  # daylight saving arrives through `timedatectl` and there is no offset
  # written down anywhere to go stale. The timezone in the `location` block
  # above is what the weather provider is told; the *system* timezone is what
  # decides this. They should agree, and on this device they do.
  day_start: "07:00"
  night_start: "21:01"

  # `photos` or `clock`. The day already falls back to the clock on its own
  # when there is nothing to show — no Google account, an empty cache, a sync
  # that has not finished — so this is for a household that wants the clock
  # all day on purpose, not for one that has not set the slideshow up yet.
  day_mode: photos
  night_mode: weather

# The daytime slideshow's photographs.
#
# **Read aipi5/photos/__init__.py before changing anything here.** Google
# removed the Library API's read access to a person's own library in March
# 2025; an app can now only reach photographs the person explicitly picks, in
# Google's own picker, one session at a time. Three things follow, and none of
# them were choices:
#
#   * There is no album to subscribe to. What gets remembered is the *set* the
#     person picked — the settings page calls it a collection and shows the
#     day it was chosen.
#   * The cache below is not an optimisation. A picked photograph is reachable
#     from Google only while its session lives, so these files are the durable
#     copy and the slideshow runs from them forever after.
#   * Picking needs a phone. The panel shows a QR code; Settings → Screensaver
#     → Choose Photos.
#
# The one-time account authorisation is `./scripts/link-google-photos.sh`, run
# over ssh. Nothing secret is in this file: the OAuth client and the refresh
# token are two files under ~/.config/aipi5, chmod 0600, and no token is ever
# logged.
photos:
  enabled: true

  # Section 11's 10–15 seconds. The crossfade is CSS opacity on two layers —
  # the one transition a compositor animates without waking the CPU — so a
  # second of it costs nothing measurable on this Pi.
  interval_seconds: 15
  transition_ms: 1000

  # Shuffled, and the page keeps a queue so nothing repeats until the whole
  # set has been shown. Random-every-time would show the same photograph twice
  # in five minutes on a set of thirty.
  shuffle: true

  # Two ceilings; whichever is reached first wins. The count is what a person
  # can reason about, the megabytes are what actually protects the card — one
  # photograph is not the size of another. About 300 at this download size is
  # a little over 100 MB in practice.
  #
  # Eviction only ever deletes local copies. Nothing in this project can
  # delete anything from a Google Photos account, and `aipi5/photos/cache.py`
  # makes no network calls at all.
  max_photos: 300
  max_cache_mb: 512

  # And a floor, which outranks both ceilings.
  #
  # Cleanup may never take the running slideshow below this many photographs.
  # The reason is that these copies become unrecoverable: the picking session
  # behind them expires — measured against the live API on 2026-08-13, a
  # session's `expireTime` came back **seven days** out — after which a
  # photograph deleted here is gone until somebody picks again with their
  # phone. A number edited in this file must not be able to do that.
  #
  # So the order is: leftovers from sets nobody is playing go first and go
  # entirely; the chosen set is touched only after that, and only down to
  # here. If the floor and the ceilings genuinely conflict — a `max_photos`
  # lowered below this — the floor wins, the cache sits above its limit, and
  # the journal says so. Only replacing the selection or disconnecting the
  # account empties it, and both are things a person asked for.
  min_photos: 50

  # How often the sync thread looks for work. It has nothing to do once every
  # picked photograph is on disk and the session behind it has expired, so a
  # device that has been running since spring makes no Google API calls at
  # all — which is the answer to "excessive API calls" being that there are
  # none rather than that they are rationed.
  sync_minutes: 60

  # What to ask Google for. A bounding box, not a crop: the API preserves the
  # aspect ratio, which is why nothing in this project has to know whether a
  # photograph is portrait or landscape. 1600x1000 is the 1280x800 panel with
  # room to spare and about a quarter of the bytes of an original.
  download_size: w1600-h1000

  # Under ~/.cache rather than in the repository or in ~/.config: these are
  # re-downloadable copies of somebody else's photographs, and losing the lot
  # costs a sync rather than anything irreplaceable.
  cache_dir: ~/.cache/aipi5/photos

  # A small date and album caption, bottom left, fading after six seconds.
  # Off by default — section 13 asks for it to be optional and never to cover
  # the photograph.
  show_info: false

  # The Google account, named rather than embedded. **Neither file belongs in
  # this repository and neither is written by it in a readable place**: the OAuth
  # client and the refresh token are 0600 under ~/.config/aipi5, put there by
  # ./scripts/link-google-photos.sh. These are the defaults; they are here to be
  # found, not to be changed:
  #
  #   client_file: ~/.config/aipi5/google-photos-client.json
  #   token_file:  ~/.config/aipi5/google-photos-token.json
  #
  # The consent screen must be published "In production" — left in "Testing",
  # Google expires the refresh token after seven days and the slideshow dies
  # with `invalid_grant`. Only the Photos **Picker** API is enabled; the library
  # read scopes were withdrawn in March 2025, which is why what this remembers
  # is a picked set rather than an album.

kodama:
  enabled: true
  # How Kodama-Lite is started. Its own README is explicit that the systemd
  # user unit is the only thing that should launch it — the desktop icon runs
  # a second copy behind systemd's back, which gets its own stream server port
  # and plays the last queue over the top of the first. So this is that unit,
  # not the binary.
  service: kodama-lite.service
  # How long to wait for the app to answer MPRIS after being asked to start.
  # Tauri plus a webview on this Pi is several seconds cold.
  start_timeout_s: 20.0

# The remote video call — a phone calling this device over WebRTC.
#
# **OFF in the committed file, and on the device — that difference is deliberate
# and is asserted by a test** (`test_the_shipped_configuration_does_not_enable
# _calling`, which skips itself when there is no `.git` beside it). Everything
# else in this file fails towards a feature not working; this one flag decides
# whether anything listens at all, so a checkout must never turn it on for
# somebody who has not chosen it. Enabling it is the one local edit the deployed
# copy carries.
#
# **How it is actually reached, as deployed: Tailscale, not this process.**
# `tailscale serve` publishes
#
#     https://aipi5.tail250c52.ts.net  ->  http://127.0.0.1:8443   (tailnet only)
#
# so TLS, the certificate and the identity of who may connect are all Tailscale's,
# and this process binds **loopback** with `tls: false` — the values below. That
# is why the old warning about a listener on 0.0.0.0 no longer applies to this
# device: nothing on the LAN can reach the port at all.
#
# Two things still have to be true before a phone can ring: this flag, and at
# least one paired phone (./scripts/pair-phone.sh). Every route authenticates
# regardless of who is in front of it.
#
# Nothing in this block is a secret. The tokens live under ~/.config/aipi5/,
# outside this repository, and are generated on the device — see
# aipi5/call/tokens.py for why only hashes are kept.
call:
  enabled: false
  # Loopback, because Tailscale Serve is what the phone actually talks to. Set
  # `host: 0.0.0.0` and `tls: true` instead to have this process terminate TLS
  # itself with the certificate under ~/.config/aipi5 — the original
  # arrangement, still supported, and the one that needs thinking about before
  # it is chosen. 8443 rather than 443 so it needs no privilege either way.
  host: 127.0.0.1
  # False because the proxy in front of it has already done TLS, and doing it
  # twice would mean Tailscale speaking HTTP to an HTTPS socket. **This is only
  # safe behind that proxy or on loopback**: the token a phone presents is on
  # the wire otherwise.
  tls: false
  port: 8443

  # Calls intentionally remain at 720p30. The BRIO 4K can capture 720p90, but
  # tripling the WebRTC encode and home-uplink load does not improve gesture
  # play; the fast mode is reserved for the local AI Motion pipeline.
  width: 1280
  height: 720
  fps: 30

  # Empty is correct on a home network: two devices on the same subnet find
  # each other with host candidates, and a STUN round trip only adds latency to
  # a call that was going to connect anyway.
  #
  # Phase 3 — the phone on 5G, the Pi behind a router — is what these are for.
  # STUN tells each peer what its own address looks like from outside, which is
  # enough whenever both NATs will accept a packet from somewhere they have
  # just sent one to. TURN relays the media when they will not, which on mobile
  # carriers is common. `./scripts/setup-turn.sh` configures both ends.
  stun_servers: []
  # - stun:turn.example.net:3478

  # **No credential belongs in this file.** Coturn's `use-auth-secret` mode
  # takes a shared secret and the Pi mints a username and password per call
  # that expire within the hour — so what reaches the phone is worthless
  # tomorrow, and the secret never leaves this device. Name where it lives:
  #
  #   secret_file:  a path, resolved under ~/.config/aipi5 when relative
  #   secret_env:   an environment variable, for a systemd EnvironmentFile
  #
  # `username`/`credential` are still accepted for a hosted relay that offers
  # nothing else, and are the second choice — a fixed TURN password has to
  # reach the phone to be used, so it ends up in local storage on a device
  # somebody can lose, and a leaked one is an open relay on your bill.
  turn_servers: []
  # - urls: turn:turn.example.net:3478
  #   secret_file: turn-secret
  #   ttl: 3600

  # **Nothing secret is in this file, and these are why it does not need to be.**
  # The list of phones allowed to call, and the certificate and key for the
  # `tls: true` arrangement above, all live under ~/.config/aipi5 — outside the
  # repository. These are only where to look, commented out because the defaults
  # are already the right answers and a path written twice is a path that can
  # disagree with itself:
  #
  #   certificate: ~/.config/aipi5/call-cert.pem
  #   private_key:  ~/.config/aipi5/call-key.pem
  #   devices:      ~/.config/aipi5/call-devices.json

# The folder the phone can put things in, and the limits around it. Section 37.
#
# **Outside the repository, deliberately.** Uploads are somebody's photos and
# videos, not source, and a transfer directory inside a git checkout is one
# `git status` away from being confusing and one `git clean` away from being gone.
files:
  enabled: true
  # `~` is expanded when the store is built, so the same line works whichever
  # user the service runs as.
  root: ~/Downloads/AIPI5
  # One upload's ceiling, in gigabytes. `AIPI5_FILE_MAX_UPLOAD_GB` in the
  # environment overrides it — the opposite precedence to everything else here,
  # and the whole point of that variable: a one-off large transfer without
  # editing YAML on a device that has no keyboard.
  max_upload_gb: 2.0
  # Never fill the root filesystem. The assistant writes a conversation
  # database, Chromium writes a profile and systemd writes a journal, and none
  # of the three fail gracefully at zero bytes free.
  reserve_gb: 2.0
  # The Pi has four cores and one uplink; two at once is already generous.
  max_concurrent: 2

assistant:
  # Everything the router does not recognise goes to the model. Turning this
  # off makes AIPI5 behave exactly like AIA: known commands work, everything
  # else is repeated back.
  llm_enabled: true
  # Where the conversation and the recordings are kept, and for how long. Same
  # promise AIA makes, and the same 24 hours.
  retention_hours: 24.0
  # A short rising chime the instant the wake word fires, before anything slower
  # happens. On by default: without it the only acknowledgement is a line on the
  # screen, which is no use to somebody across the room, outside the camera's
  # view, or standing back from the panel with their hands up playing a motion
  # game — and the only way to find out whether the wake word fired is to say
  # the whole command and see.
  wake_chime: true
