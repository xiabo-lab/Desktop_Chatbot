<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- `viewport-fit=cover` plus the safe-area insets below: on a notched iPhone
     a full-bleed video otherwise puts the End Call button under the home
     indicator, where the swipe-up gesture wins and the tap does not. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Added to the Home Screen this behaves like an app: its own icon, no address
     bar, launched full-screen. `apple-mobile-web-app-capable` is what does it
     and is Safari-only — a shortcut added from Chrome on iOS reopens Chrome
     with its chrome over the video, which is why the pairing instructions say
     to install from Safari.
     Without `apple-touch-icon` iOS makes an icon out of a screenshot of the
     page, which for a mostly-black page is a black square. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AIPI5">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<!-- Android and desktop Chrome install from this instead. iOS ignores it and
     uses the Apple tags above, so both are needed. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<title>Call AIPI5</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --panel-edge: #232a35;
    --ink: #e8edf4; --ink-dim: #92a0b4; --accent: #4da3ff; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; user-select: none;
  }
  body { display: flex; flex-direction: column; }

  /* ── the dialler ─────────────────────────────────────────────── */
  #home {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    padding: calc(env(safe-area-inset-top) + 24px) 28px
             calc(env(safe-area-inset-bottom) + 24px);
    text-align: center;
  }
  #home h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 0.04em; }
  #home p { margin: 0; color: var(--ink-dim); font-size: 17px; line-height: 1.5; }
  #dial {
    margin-top: 10px; width: 190px; height: 190px; border-radius: 50%;
    border: none; background: #1d7a44; color: #fff;
    font-size: 21px; font-family: inherit; font-weight: 600;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; cursor: pointer;
  }
  #dial .glyph { font-size: 54px; line-height: 1; }
  #dial:active { background: #249854; }
  #dial:disabled { background: #2a3240; color: var(--ink-dim); }
  #note { font-size: 15px; color: var(--ink-dim); min-height: 22px; }
  #note.bad { color: var(--danger); }
  #allow-ring {
    margin-top: 4px; padding: 12px 20px; border-radius: 12px;
    border: 1px solid var(--panel-edge); background: var(--panel);
    color: var(--ink); font-size: 16px; font-family: inherit; cursor: pointer;
  }
  #allow-ring[hidden] { display: none; }

  /* ── files ───────────────────────────────────────────────────── */
  /*
     A phone-shaped page rather than a shrunk copy of the Pi's: one column,
     rows big enough to hit with a thumb, and nothing that depends on hovering
     or dragging. The Files app is the destination for everything downloaded
     here, so the page's job ends at handing Safari a link.
  */
  #files {
    flex: 1; display: none; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 16px) 18px
             calc(env(safe-area-inset-bottom) + 16px);
    overflow: hidden;
  }
  #files.on { display: flex; }
  .bar-top {
    display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
    margin-bottom: 14px;
  }
  .bar-top h2 { margin: 0; font-size: 21px; font-weight: 600; flex: 1; }
  .plain {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: var(--panel); color: var(--ink); font-size: 16px;
    font-family: inherit; cursor: pointer;
  }
  .plain:active { border-color: var(--accent); }
  #files-send {
    width: 100%; padding: 16px; border-radius: 14px; border: none;
    background: #1d5fa8; color: #fff; font-size: 18px; font-weight: 600;
    font-family: inherit; cursor: pointer; flex: 0 0 auto;
  }
  #files-send:active { background: #2a76c9; }
  #files-send:disabled { background: #2a3240; color: var(--ink-dim); }
  #files-storage {
    font-size: 13px; color: var(--ink-dim); margin: 10px 2px 4px;
    flex: 0 0 auto;
  }
  #files-progress { display: none; margin: 8px 0 4px; flex: 0 0 auto; }
  #files-progress.on { display: block; }
  #files-progress .what {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 13px; color: var(--ink-dim); margin-bottom: 6px;
  }
  #files-progress .what b { color: var(--ink); font-weight: 500;
                            overflow: hidden; text-overflow: ellipsis;
                            white-space: nowrap; }
  .bar { height: 10px; border-radius: 5px; background: var(--panel);
         border: 1px solid var(--panel-edge); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent);
              transition: width 0.2s linear; }
  #files-progress.failed .bar span { background: var(--danger); }
  #files-progress.done .bar span { background: #4ec97a; }
  #files-list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    margin-top: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .frow {
    background: var(--panel); border: 1px solid var(--panel-edge);
    border-radius: 12px; padding: 12px 14px; display: flex;
    align-items: center; gap: 12px;
  }
  .frow .kind { font-size: 22px; flex: 0 0 auto; }
  .frow .about { flex: 1; min-width: 0; }
  .frow .name { font-size: 16px; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  .frow .meta { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
  .frow .go { flex: 0 0 auto; padding: 10px 14px; border-radius: 10px;
              border: 1px solid var(--panel-edge); background: #1a2230;
              color: var(--ink); font-size: 15px; font-family: inherit; }
  .frow .go.danger { color: var(--danger); }
  /* The Open link, which is an anchor rather than a button so that tapping it
     is a real navigation gesture — see `downloadFile`. */
  .frow a.go { text-decoration: none; display: inline-block; }
  .frow a.go.ready { border-color: var(--accent); color: var(--accent); }
  .frow.confirming { border-color: var(--danger); }
  #files-empty { margin: auto; text-align: center; color: var(--ink-dim);
                 font-size: 15px; line-height: 1.6; padding: 20px; }
  #files-note { font-size: 13px; color: var(--ink-dim); min-height: 18px;
                margin-top: 8px; flex: 0 0 auto; }
  #files-note.bad { color: var(--danger); }
  #open-files {
    margin-top: 4px; padding: 12px 20px; border-radius: 12px;
    border: 1px solid var(--panel-edge); background: var(--panel);
    color: var(--ink); font-size: 16px; font-family: inherit; cursor: pointer;
  }

  /* ── being rung ──────────────────────────────────────────────── */
  #incoming {
    flex: 1; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    padding: calc(env(safe-area-inset-top) + 24px) 28px
             calc(env(safe-area-inset-bottom) + 24px);
    text-align: center;
  }
  #incoming.on { display: flex; }
  #incoming h1 { margin: 0; font-size: 30px; font-weight: 600; }
  #incoming p { margin: 0; color: var(--ink-dim); font-size: 16px; }
  #accept {
    margin-top: 14px; width: 170px; height: 170px; border-radius: 50%;
    border: none; background: #1d7a44; color: #fff;
    font-size: 20px; font-family: inherit; font-weight: 600;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; cursor: pointer;
    /* Pulsing, because this screen may be looked at from across a room and
       the difference between "ringing" and "a screen that is just sitting
       there" is motion. */
    animation: ring 1.4s ease-in-out infinite;
  }
  #accept .glyph { font-size: 46px; line-height: 1; }
  @keyframes ring { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  #decline {
    padding: 12px 26px; border-radius: 12px; border: 1px solid var(--panel-edge);
    background: transparent; color: var(--ink-dim); font-size: 17px;
    font-family: inherit; cursor: pointer;
  }

  /* ── the call ────────────────────────────────────────────────── */
  #call { flex: 1; position: relative; background: #05070a; display: none; }
  #call.on { display: block; }
  /* `contain`, so the Pi's 16:9 is letterboxed on a tall phone rather than
     cropped to it. The requirement is explicit that video must not be
     stretched, and cropping a 1280x800 room shot to a 19.5:9 phone throws away
     a third of the picture. */
  #remote {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #05070a;
  }
  #self {
    position: absolute; right: 14px;
    top: calc(env(safe-area-inset-top) + 14px);
    width: 108px; height: 144px; object-fit: cover;
    border-radius: 12px; border: 1px solid var(--panel-edge);
    background: #05070a; transform: scaleX(-1); z-index: 2;
  }
  #banner {
    position: absolute; left: 14px; top: calc(env(safe-area-inset-top) + 14px);
    z-index: 2; padding: 8px 16px; border-radius: 999px;
    background: rgba(0,0,0,0.5); font-size: 14px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 9px;
  }
  #banner .live {
    width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
  }
  #banner.up .live { background: #59d98e; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
  #banner:not(.up) .live { animation: pulse 1.1s infinite; }

  #controls {
    position: absolute; left: 0; right: 0; z-index: 2;
    bottom: 0; padding: 60px 20px calc(env(safe-area-inset-bottom) + 22px);
    background: linear-gradient(to top, rgba(4,7,11,0.9) 40%, rgba(4,7,11,0));
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  .ctl {
    width: 66px; height: 66px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.16); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    padding: 0;
  }
  .ctl svg { width: 30px; height: 30px; fill: none; stroke: currentColor; }
  .ctl svg .fill { fill: currentColor; stroke: none; }
  .ctl svg .line { stroke-width: 2; stroke-linecap: round; fill: none; }
  /* The slash, and the gap around it. Two strokes on the same line: the wider
     one in the button's own colour cuts a channel through the glyph, which is
     what makes a struck-through icon read as struck through rather than as a
     smudge. Hidden until the control is off. */
  .ctl svg .cut, .ctl svg .slash { display: none; stroke-linecap: round; }
  .ctl svg .cut { stroke: #3b4351; stroke-width: 5; }
  .ctl svg .slash { stroke-width: 2.2; }
  .ctl.off svg .cut, .ctl.off svg .slash { display: block; }
  /* Off is white-on-dark inverted, the way every phone does it, with the slash
     doing the actual telling. */
  .ctl.off { background: #fff; color: #12161d; }
  .ctl.off svg .cut { stroke: #fff; }
  #hang { width: 86px; height: 66px; border-radius: 33px; background: #d3383f; }
  #hang svg { transform: rotate(133deg); }
  #hang:active { background: #ef4952; }
</style>
</head>
<body>

<div id="home">
  <h1>AIPI5</h1>
  <p id="who">Checking this phone…</p>
  <button id="dial" disabled><span class="glyph">📞</span>Call AIPI5</button>
  <div id="note"></div>
  <!-- Only shown when the phone is not yet set up to be rung. Asking for
       notification permission has to come from a tap — iOS refuses a request
       made on page load — so it is a button rather than something automatic. -->
  <button id="allow-ring" hidden>Let AIPI5 ring this phone</button>
  <button id="open-files">⇅ Files</button>
</div>

<!-- Sending and fetching files, on the same connection and the same token as
     the call. A separate screen rather than something under the dialler: the
     dialler is one button on purpose, and a file list under it is a list to
     scroll past while trying to press Call. -->
<div id="files">
  <div class="bar-top">
    <button class="plain" id="files-back">‹ Back</button>
    <h2>Files</h2>
    <button class="plain" id="files-refresh">Refresh</button>
  </div>

  <button id="files-send">Upload File</button>
  <!-- No `accept` attribute: iOS reads it as a filter and this feature exists
       to move whatever somebody has. `multiple` so a set of photos is one
       trip. The picker opens on a tap and never on its own. -->
  <input id="files-picker" type="file" multiple hidden>

  <div id="files-progress">
    <div class="what"><b id="files-progress-name"></b><span id="files-progress-detail"></span></div>
    <div class="bar"><span id="files-progress-bar"></span></div>
  </div>

  <div id="files-storage"></div>
  <div id="files-list"></div>
  <div id="files-note"></div>
</div>

<!-- The Pi is calling. A separate screen rather than a variant of the dialler,
     because the only two things that matter here are answer and decline, and
     anything else on the screen is something to hit by mistake while reaching
     for one of them. -->
<div id="incoming">
  <h1>AIPI5 is calling</h1>
  <p id="incoming-note">Answer to open the camera and microphone.</p>
  <button id="accept"><span class="glyph">📞</span>Answer</button>
  <button id="decline">Decline</button>
</div>

<div id="call">
  <video id="remote" autoplay playsinline></video>
  <video id="self" autoplay playsinline muted></video>
  <div id="banner"><span class="live"></span><span id="banner-text">Calling…</span></div>
  <!-- Drawn, not typed. These carry no words, so the whole state is "on or
       off" and the slash is the only thing that says which — emoji cannot do
       that, and would also render differently on every phone. -->
  <div id="controls">
    <button class="ctl" id="mic" aria-label="Mute the microphone" title="Mute">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect class="fill" x="9" y="2" width="6" height="11" rx="3"/>
        <path class="line" d="M5 11a7 7 0 0 0 14 0"/>
        <path class="line" d="M12 18v3"/>
        <path class="cut" d="M4 21 21 4"/>
        <path class="slash" d="M4 21 21 4"/>
      </svg>
    </button>
    <button class="ctl" id="hang" aria-label="End the call" title="End call">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="fill" d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
      </svg>
    </button>
    <button class="ctl" id="cam" aria-label="Turn the camera off" title="Camera">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect class="fill" x="2" y="6" width="13" height="12" rx="2.5"/>
        <path class="fill" d="M16 10.2 22 7v10l-6-3.2z"/>
        <path class="cut" d="M4 21 21 4"/>
        <path class="slash" d="M4 21 21 4"/>
      </svg>
    </button>
  </div>
</div>

<script>
"use strict";

// The token arrives in the fragment of a pairing link and is copied into local
// storage. The *fragment* rather than the query string on purpose: a fragment
// is never sent to the server, never reaches an access log, and never appears
// in a Referer header.
//
// **The fragment is deliberately left in the address.** An earlier version
// stripped it with `history.replaceState`, on the reasoning that a screenshot
// of the page should not be a working credential. That broke the thing this
// page is for: on iOS a Home Screen app gets its **own storage**, separate
// from Safari's, so a token paired in the browser is invisible to the
// installed app — and with the fragment stripped, the saved shortcut had no
// way to supply it either. Every launch said "this phone is not paired".
//
// Keeping it means the shortcut itself carries the token, and each launch
// re-claims it into whichever storage it has. The cost is that the link is a
// credential wherever it is written down, which was already true of the
// pairing message; the installed app has no address bar to display it, and
// anyone holding the unlocked phone could read local storage anyway.
const STORE = "aipi5.call.token";
(function claimToken() {
  const match = /[#&]t=([A-Za-z0-9_\-]{16,128})/.exec(location.hash || "");
  if (!match) return;
  try { localStorage.setItem(STORE, match[1]); } catch (e) { /* private mode */ }
})();

let token = "";
try { token = localStorage.getItem(STORE) || ""; } catch (e) { token = ""; }

const el = (id) => document.getElementById(id);
const note = (text, bad) => {
  el("note").textContent = text || "";
  el("note").classList.toggle("bad", !!bad);
};

// ── files ───────────────────────────────────────────────────────────
//
// The same folder the Pi's own screen shows, over the same authenticated
// connection as the call. Two things here are shaped by iOS rather than by
// preference.
//
// **A download has to be a plain link.** Safari saves a file to the Files app
// when the person taps a URL; fetching it with the bearer token and handing
// back a blob would mean the whole file in the phone's memory first, which for
// the videos this exists to move does not survive. So the page asks for a
// one-shot ticket — authenticated, like everything else — and then navigates
// to a link that carries it. See `aipi5/files/tickets.py`.
//
// **Progress needs XMLHttpRequest.** `fetch` cannot report upload progress in
// WebKit, and every browser on iOS is WebKit. A 300 MB video with no bar is
// indistinguishable from a phone that has frozen.

let filesBusy = false;
let filesConfirming = "";
// The folder's revision, as of the last time this page looked. A file put on
// the Pi — by the screen, over ssh, by anything — shows up here on the idle
// poll rather than waiting for somebody to press Refresh.
let filesRev = null;

function filesFromState(state) {
  const revision = state.files_rev;
  if (revision === undefined) return;
  if (filesRev === null) { filesRev = revision; return; }
  if (revision === filesRev) return;
  filesRev = revision;
  // Only when the list is on screen, and never over a half-finished gesture.
  if (el("files").classList.contains("on") && !filesBusy && !filesConfirming) {
    loadFiles();
  }
}

function filesNote(text, bad) {
  el("files-note").textContent = text || "";
  el("files-note").classList.toggle("bad", !!bad);
}

function showFiles(on) {
  el("files").classList.toggle("on", !!on);
  el("home").style.display = on ? "none" : "";
  if (on) loadFiles();
}

function sizeText(bytes) {
  if (bytes < 1024) return bytes + " B";
  const units = ["KB", "MB", "GB", "TB"];
  let value = bytes / 1024, index = 0;
  while (value >= 1024 && index < units.length - 1) { value /= 1024; index += 1; }
  return value.toFixed(1) + " " + units[index];
}

function kindGlyph(type, name) {
  if (/^image\//.test(type || "")) return "🖼";
  if (/^video\//.test(type || "")) return "🎬";
  if (/^audio\//.test(type || "")) return "🎵";
  if (/pdf$/.test(type || "")) return "📕";
  if (/^text\//.test(type || "")) return "📄";
  if (/zip|tar|gzip|compressed/.test(type || "")
      || /\.(zip|tar|gz|xz|7z)$/i.test(name)) return "🗜";
  return "📦";
}

async function loadFiles() {
  try {
    const response = await api("/call/v1/files");
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || "unavailable");
    drawFiles(payload);
    filesNote("");
  } catch (err) {
    el("files-list").innerHTML = "";
    el("files-storage").textContent = "";
    filesNote(err.message || "Could not read the folder.", true);
  }
}

function drawFiles(payload) {
  const storage = payload.storage || {};
  el("files-storage").textContent =
    "Free: " + sizeText(storage.free || 0) + " · Used: " + sizeText(storage.used || 0);

  const list = el("files-list");
  list.innerHTML = "";
  const files = payload.files || [];
  if (!files.length) {
    const empty = document.createElement("div");
    empty.id = "files-empty";
    empty.textContent = "Nothing on AIPI5 yet. Upload something, or put a file "
      + "in the folder on the Pi and pull it down here.";
    list.appendChild(empty);
    return;
  }
  for (const file of files) list.appendChild(fileRow(file));
}

function fileRow(file) {
  const row = document.createElement("div");
  row.className = "frow";

  const kind = document.createElement("div");
  kind.className = "kind";
  kind.textContent = kindGlyph(file.type, file.name);

  const about = document.createElement("div");
  about.className = "about";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = file.name;             // never innerHTML: somebody's text
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = sizeText(file.size) + " · "
    + (file.modified_iso || "").replace("T", " ").slice(0, 16);
  about.appendChild(name);
  about.appendChild(meta);

  const get = document.createElement("button");
  get.className = "go";
  // "Save", because that is what happens: it lands in the Files app. "Get"
  // said nothing about where the file went, which is the one thing somebody
  // needs to know afterwards.
  get.textContent = "Save";
  get.addEventListener("click", () => downloadFile(file, get));

  const remove = document.createElement("button");
  remove.className = "go danger";
  remove.textContent = "Delete";
  remove.addEventListener("click", () => confirmDelete(row, file, remove));

  row.appendChild(kind);
  row.appendChild(about);
  row.appendChild(get);
  row.appendChild(remove);
  return row;
}

// Getting a file onto the phone without navigating anywhere.
//
// Three attempts, and the first two are worth writing down because they are
// the obvious ones and they both trap somebody in an installed app.
//
// `location.href = url` replaces the app with the file. The app *is* the page
// here, so there is no back button, no address bar and no tabs: the only way
// out is to force-quit it.
//
// An anchor with `download`, clicked programmatically, fails the same way for
// a subtler reason — a scripted click is not a user gesture, so WebKit ignores
// both `download` and `target="_blank"` and navigates this window instead.
//
// A real tap on that anchor is a gesture, and it *still* fails: WebKit takes
// a `Content-Disposition: attachment` and draws its own download page — the
// file icon, "Open in Preview", "More…" — inside the app, again with nothing
// to go back to. `target="_blank"` does not escape a standalone web app.
//
// The answer is not to navigate at all. `XMLHttpRequest` carries the bearer
// token and reads the file into memory, and `navigator.share` hands it to the
// iOS share sheet, which appears *over* the app: "Save to Files", then the
// sheet closes and the file list is exactly where it was. Two taps, because
// `share()` needs a user gesture of its own and the fetch has to happen first.
//
// The cost is the file in the phone's memory for a moment, which is why very
// large ones fall back to a link — and that link is the least-bad remaining
// option rather than a good one.

//: Beyond this, the share sheet is not worth the memory on a phone.
const SHARE_MAX_BYTES = 300 * 1024 * 1024;

function fetchIntoMemory(file) {
  return new Promise((resolve, reject) => {
    const request = new XMLHttpRequest();
    request.open("GET", "/call/v1/files/raw/" + encodeURIComponent(file.name));
    request.setRequestHeader("Authorization", "Bearer " + token);
    request.responseType = "blob";
    request.addEventListener("progress", (event) => {
      if (!event.lengthComputable) return;
      const percent = Math.round((event.loaded / event.total) * 100);
      filesProgress("busy", file.name,
                    sizeText(event.loaded) + " / " + sizeText(event.total)
                    + " · " + percent + "%", percent);
    });
    request.addEventListener("load", () => {
      if (request.status === 200) resolve(request.response);
      else reject(new Error("HTTP " + request.status));
    });
    request.addEventListener("error", () => reject(new Error("the connection dropped")));
    request.addEventListener("abort", () => reject(new Error("cancelled")));
    request.send();
  });
}

function offerShare(file, blob, button) {
  const shareable = new File([blob], file.name,
                             { type: file.type || "application/octet-stream" });
  const share = document.createElement("button");
  share.className = "go ready";
  share.textContent = "Share ↗";
  share.addEventListener("click", async () => {
    // Synchronous inside the tap: `share()` needs the gesture, and an `await`
    // before it is what turns this into "NotAllowedError".
    try {
      await navigator.share({ files: [shareable], title: file.name });
      filesNote("Saved. Choose Save to Files, or send it anywhere.");
    } catch (err) {
      // AbortError is somebody closing the sheet, which is not a failure.
      if (!err || err.name !== "AbortError") {
        filesNote((err && err.message) || "The share sheet did not open.", true);
      }
    }
  });
  button.replaceWith(share);
  filesNote("Tap Share → Save to Files. The sheet opens over this page, so "
            + "nothing here is lost.");
}

function offerLink(file, button, why) {
  // No share sheet available, or the file is too big to hold in memory. A
  // link, with what it costs said out loud rather than discovered.
  api("/call/v1/files/ticket", {
    method: "POST", body: JSON.stringify({ name: file.name }),
  }).then((response) => response.json()).then((payload) => {
    if (!payload.url) throw new Error(payload.error || "no link");
    const link = document.createElement("a");
    link.className = "go ready";
    link.textContent = "Open ↗";
    link.href = payload.url;
    link.rel = "noopener";
    link.target = "_blank";
    button.replaceWith(link);
    filesNote(why + " Tap Open, then Share to save it — and swipe up and "
              + "reopen AIPI5 to come back.", true);
  }).catch((err) => {
    filesNote(err.message || "Could not fetch that file.", true);
    button.disabled = false;
  });
}

async function downloadFile(file, button) {
  button.disabled = true;

  const probe = new File([new Blob([])], file.name,
                         { type: file.type || "application/octet-stream" });
  const canShare = !!(navigator.canShare && navigator.share
                      && navigator.canShare({ files: [probe] }));
  if (!canShare) {
    offerLink(file, button, "This browser cannot open a share sheet.");
    return;
  }
  if (file.size > SHARE_MAX_BYTES) {
    offerLink(file, button, "That file is too large to hold in memory.");
    return;
  }

  filesNote("Fetching " + file.name + "…");
  filesProgress("busy", file.name, "starting…", 0);
  try {
    const blob = await fetchIntoMemory(file);
    filesProgress("done", "Ready to save", file.name, 100);
    setTimeout(() => filesProgress("idle"), 3000);
    offerShare(file, blob, button);
  } catch (err) {
    filesProgress("failed", "Could not fetch it", (err && err.message) || "", 100);
    filesNote((err && err.message) || "Could not fetch that file.", true);
    button.disabled = false;
  }
}

function confirmDelete(row, file, button) {
  if (filesConfirming !== file.name) {
    filesConfirming = file.name;
    row.classList.add("confirming");
    button.textContent = "Sure?";
    filesNote("Delete “" + file.name + "”? Press again to confirm.");
    setTimeout(() => {
      if (filesConfirming === file.name) {
        filesConfirming = "";
        filesNote("");
        loadFiles();
      }
    }, 6000);
    return;
  }
  filesConfirming = "";
  api("/call/v1/files/delete", {
    method: "POST", body: JSON.stringify({ name: file.name }),
  }).then(() => { filesNote("Deleted " + file.name); loadFiles(); })
    .catch((err) => filesNote(err.message || "Could not delete it.", true));
}

function filesProgress(state, name, detail, percent) {
  const box = el("files-progress");
  box.classList.toggle("on", state !== "idle");
  box.classList.toggle("failed", state === "failed");
  box.classList.toggle("done", state === "done");
  el("files-progress-name").textContent = name || "";
  el("files-progress-detail").textContent = detail || "";
  el("files-progress-bar").style.width = (percent || 0) + "%";
}

function uploadFiles(chosen) {
  if (filesBusy || !chosen.length) return;
  filesBusy = true;
  el("files-send").disabled = true;
  const queue = Array.from(chosen);
  let index = 0;

  const finish = () => {
    filesBusy = false;
    el("files-send").disabled = false;
  };
  const next = () => {
    if (index >= queue.length) {
      finish();
      filesProgress("done", "Upload complete",
                    queue.length > 1 ? queue.length + " files" : "", 100);
      loadFiles();
      setTimeout(() => { if (!filesBusy) filesProgress("idle"); }, 4000);
      return;
    }
    const file = queue[index];
    index += 1;
    sendOneFile(file, queue.length > 1 ? `(${index}/${queue.length}) ` : "",
                next, finish);
  };
  next();
}

function sendOneFile(file, prefix, done, failed) {
  const form = new FormData();
  form.append("file", file, file.name);

  const request = new XMLHttpRequest();
  request.open("POST", "/call/v1/files/upload");
  // The same bearer token as every other request from this page. It is a
  // header, not a query parameter, for the reason it always was: a token in a
  // URL is a token in a log.
  request.setRequestHeader("Authorization", "Bearer " + token);
  request.upload.addEventListener("progress", (event) => {
    if (!event.lengthComputable) return;
    const percent = Math.round((event.loaded / event.total) * 100);
    filesProgress("busy", prefix + file.name,
                  sizeText(event.loaded) + " / " + sizeText(event.total)
                  + " · " + percent + "%", percent);
  });
  request.addEventListener("load", () => {
    if (request.status >= 200 && request.status < 300) {
      done();
      return;
    }
    let why = "";
    try { why = (JSON.parse(request.responseText) || {}).error || ""; } catch (e) {}
    failed();
    filesProgress("failed", "Upload failed", why || ("HTTP " + request.status), 100);
    loadFiles();
  });
  request.addEventListener("error", () => {
    // Wi-Fi to cellular mid-upload, a tunnel, a locked phone. Nothing partial
    // survives on the Pi — it deletes what it had — so this is safe to retry.
    failed();
    filesProgress("failed", "Upload failed",
                  "the connection dropped — try again", 100);
  });
  request.addEventListener("abort", () => { failed(); filesProgress("idle"); });
  filesProgress("busy", prefix + file.name, "starting…", 0);
  request.send(form);
}

el("open-files").addEventListener("click", () => showFiles(true));
el("files-back").addEventListener("click", () => showFiles(false));
el("files-refresh").addEventListener("click", loadFiles);
el("files-send").addEventListener("click", () => el("files-picker").click());
el("files-picker").addEventListener("change", (event) => {
  uploadFiles(event.target.files);
  event.target.value = "";
});

// ── the call ────────────────────────────────────────────────────────

let pc = null;          // RTCPeerConnection
let local = null;       // MediaStream from this phone
let session = "";
let cursor = 0;
let polling = false;
let iceServers = [];
// Candidates that arrive before the remote description is set. Safari
// genuinely does this — the Pi's answer and its first candidates cross on the
// wire — and `addIceCandidate` before `setRemoteDescription` throws, which
// loses exactly the candidate that would have connected the call.
let pendingCandidates = [];
//: The session the Pi is ringing us with, while the answer screen is up.
let incomingSession = "";
//: Polls state slowly while idle, so an open app notices a ring even when the
//: push did not arrive — which on iOS is a real possibility rather than a
//: theoretical one.
let idleTimer = null;

async function api(path, options) {
  const response = await fetch(path, Object.assign({
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json",
    },
    cache: "no-store",
  }, options || {}));
  if (response.status === 401) throw new Error("This phone is not authorised.");
  if (response.status === 429) throw new Error("Too many attempts. Wait a few minutes.");
  // Anything 5xx is the far end, not us. In practice this is the tunnel
  // answering 502 because the assistant is stopped or restarting — measured,
  // by stopping it. Turned into a sentence here because the alternative is
  // whatever `response.json()` says when handed an HTML error page, and
  // "Unexpected token '<'" is not a thing to show somebody trying to call
  // home.
  if (response.status >= 500) {
    throw new Error("AIPI5 is not answering. It may be restarting.");
  }
  return response;
}

function send(message) {
  return api("/call/v1/send", {
    method: "POST",
    body: JSON.stringify({ session, message }),
  }).catch((err) => console.warn("send failed", err));
}

// ── being rung ──────────────────────────────────────────────────────
//
// The Pi cannot reach a page that is not running, so something on the phone
// has to be listening: a service worker, woken by iOS when a push arrives.
// Registering it and subscribing is all this section does; `sw.js` is the part
// that exists while the app does not.
//
// Two iOS rules shape it. The app must be installed to the Home Screen before
// Web Push works at all, and permission must be asked from a **tap** — a
// request made on page load is refused outright and, worse, can count as a
// denial that is then remembered.

function urlB64ToUint8Array(base64) {
  const padded = (base64 + "=".repeat((4 - base64.length % 4) % 4))
    .replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(padded);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

let swReg = null;

async function registerWorker() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  try {
    swReg = await navigator.serviceWorker.register("/sw.js");
    return swReg;
  } catch (err) {
    console.warn("service worker did not register", err);
    return null;
  }
}

// Say why it did not work, to the Pi. Nobody can open a console on a phone in
// a kiosk's life, and "no confirmation appeared" is not something anybody can
// act on. This reaches the journal.
async function reportPush(detail) {
  const installed = window.navigator.standalone === true
    || window.matchMedia("(display-mode: standalone)").matches;
  const facts = [
    detail,
    "installed=" + installed,
    "permission=" + (("Notification" in window) ? Notification.permission : "n/a"),
    "sw=" + ("serviceWorker" in navigator),
    "push=" + ("PushManager" in window),
  ].join(" · ");
  try {
    await api("/call/v1/subscribe", {
      method: "POST", body: JSON.stringify({ error: facts }),
    });
  } catch (err) { /* the reason it failed may be the reason this fails */ }
}

async function subscribeForRings() {
  const reg = swReg || await registerWorker();
  if (!reg) {
    await reportPush("no service worker registration");
    return { ok: false, why: "this browser cannot receive calls" };
  }
  // The permission prompt. Must be inside the tap that called us.
  let permission = Notification.permission;
  if (permission === "default") permission = await Notification.requestPermission();
  if (permission !== "granted") {
    await reportPush("permission is " + permission);
    return { ok: false, why: "notifications are turned off for this app" };
  }
  try {
    const keyResponse = await fetch("/call/v1/vapid", { cache: "no-store" });
    const { key } = await keyResponse.json();
    if (!key) {
      await reportPush("the Pi returned an empty VAPID key");
      return { ok: false, why: "the Pi has no push key" };
    }
    // An existing subscription is reused rather than replaced: iOS keeps one
    // across launches, and asking for a second while the first is alive fails.
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,               // required, and true on iOS
        applicationServerKey: urlB64ToUint8Array(key),
      });
    }
    const response = await api("/call/v1/subscribe", {
      method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }),
    });
    const body = await response.json();
    if (!body.ok) await reportPush("the Pi refused the subscription");
    return body.ok ? { ok: true } : { ok: false, why: "the Pi refused it" };
  } catch (err) {
    const why = (err && err.message) || "could not subscribe";
    await reportPush("subscribe threw: " + why);
    return { ok: false, why };
  }
}

function showIncoming(session, on) {
  incomingSession = on ? session : "";
  el("incoming").classList.toggle("on", !!on);
  el("home").style.display = on ? "none" : "";
  // A call outranks a file list. Somebody browsing the folder when the Pi
  // rings must see Answer and Decline and nothing else — and on the way back
  // the dialler is what should be there, not a half-scrolled listing.
  if (on) el("files").classList.remove("on");
}

// Answering. Deliberately only ever reached from a tap — there is no path here
// from a poll or a push, because a phone that answered by itself would be a
// microphone anybody at the Pi could open.
async function acceptIncoming() {
  const session = incomingSession;
  if (!session) return;
  el("accept").disabled = true;
  try {
    local = await openMedia();
  } catch (err) {
    el("accept").disabled = false;
    el("incoming-note").textContent =
      "Camera and microphone permission is needed to answer.";
    return;
  }
  let payload;
  try {
    const response = await api("/call/v1/pickup", {
      method: "POST", body: JSON.stringify({ session }),
    });
    payload = await response.json();
    if (!response.ok || !payload.ok) throw new Error("the call has gone");
  } catch (err) {
    stopLocal();
    el("accept").disabled = false;
    showIncoming("", false);
    note(err.message || "That call is no longer ringing.", true);
    return;
  }

  showIncoming("", false);
  el("accept").disabled = false;
  startSession(session, payload.ice_servers || []);
  // The phone is still the one that offers, even though the Pi rang. Who rings
  // and who offers are separate; keeping the offer here means an outgoing call
  // reuses the media path that already works.
  await makeOffer();
}

async function openMedia() {
  // AEC, noise suppression and gain control are asked for explicitly rather
  // than left to the defaults. They are the defaults in every current browser,
  // but this is the requirement the whole audio-quality section rests on and a
  // default is not a guarantee.
  //
  // 1280x720 is an *ideal*, not an exact: a phone that cannot do it should
  // give its nearest size rather than failing the call outright, which is what
  // `exact` would do.
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: { width: { ideal: 1280 }, height: { ideal: 720 },
             frameRate: { ideal: 30 }, facingMode: "user" },
  });
}

function buildPeer() {
  const peer = new RTCPeerConnection({ iceServers, bundlePolicy: "max-bundle" });

  peer.onicecandidate = (event) => {
    if (event.candidate) send({ type: "ice", candidate: event.candidate.toJSON() });
  };
  peer.ontrack = (event) => {
    // One stream carries both tracks (`max-bundle`), so this fires twice with
    // the same stream and assigning it twice is harmless.
    if (event.streams && event.streams[0]) el("remote").srcObject = event.streams[0];
  };
  peer.onconnectionstatechange = () => {
    const state = peer.connectionState;
    if (state === "connected") {
      say("Connected", true);
      send({ type: "connected" });
      recovering = false;
      if (recoveryTimer) { clearTimeout(recoveryTimer); recoveryTimer = null; }
      reportRoute(peer);
    } else if (state === "disconnected") {
      // Not fatal on its own — a phone changing cell or moving from Wi-Fi to
      // 5G lands here and often recovers by itself within a few seconds. The
      // page stays up and says so, which is what the requirement asks for.
      say("Reconnecting…", false);
      send({ type: "reconnecting" });
      scheduleRecovery();
    } else if (state === "failed") {
      // Terminal for this ICE transport: it will not retry on its own. An ICE
      // restart re-gathers candidates and is the one thing that recovers a
      // call whose network changed underneath it — a handover from Wi-Fi to
      // cellular gives the phone an entirely new address, and nothing in the
      // old candidate set can reach it.
      restartIce();
    }
  };
  return peer;
}

// Recovery, bounded. The requirement wants an automatic attempt and a clean
// end if it does not work — a call that says "Reconnecting…" forever is a
// camera left on at the other end.
const RECOVERY_LIMIT_MS = 30000;
let recovering = false;
let recoveryTimer = null;

function scheduleRecovery() {
  if (recoveryTimer) return;
  recoveryTimer = setTimeout(() => {
    recoveryTimer = null;
    if (!session) return;
    if (pc && pc.connectionState === "connected") return;
    endCall("the connection could not be recovered");
  }, RECOVERY_LIMIT_MS);
}

async function restartIce() {
  if (!pc || !session || recovering) return;
  recovering = true;
  say("Reconnecting…", false);
  send({ type: "reconnecting" });
  scheduleRecovery();
  try {
    // The phone is the caller, so renegotiation is its job — the Pi answers
    // whatever it is offered. `iceRestart` makes new credentials and gathers
    // again from scratch.
    const offer = await pc.createOffer({ iceRestart: true });
    await pc.setLocalDescription(offer);
    send({ type: "offer", sdp: pc.localDescription.sdp });
  } catch (err) {
    console.warn("ICE restart failed", err);
    endCall("the connection could not be recovered");
  }
}

// Which path the media took. See the same function in the Pi's page for why
// this is worth a round trip: "connected" and "connected through the relay"
// look identical on screen and mean very different things.
// WebKit does not report `nominated` the way Chromium does, so the strictest
// reading of the specification finds nothing here. Three fallbacks, and a
// report either way — see the same function in the Pi's page.
//
// "WebKit" rather than "Safari" on purpose: every browser on iOS is WebKit,
// because Apple requires it. Chrome on an iPhone is this same engine in a
// different wrapper, so nothing in this file behaves differently there — which
// is worth knowing before somebody debugs a call by switching browsers.
//
// Safari is still the one to install from: the `apple-mobile-web-app-*` meta
// tags at the top of this page are Safari-only, and they are what make Add to
// Home Screen open standalone rather than reopening a browser with its chrome
// over the video.
const ROUTE_TRIES = 4;
const ROUTE_RETRY_MS = 1000;

function findSelectedPair(stats) {
  let nominated = null;
  let succeeded = null;
  let selectedId = "";
  stats.forEach((report) => {
    if (report.type === "transport" && report.selectedCandidatePairId) {
      selectedId = report.selectedCandidatePairId;
    } else if (report.type === "candidate-pair" && report.state === "succeeded") {
      if ((report.nominated || report.selected) && !nominated) nominated = report;
      if (!succeeded) succeeded = report;
    }
  });
  return (selectedId && stats.get(selectedId)) || nominated || succeeded || null;
}

async function reportRoute(peer, attempt) {
  attempt = attempt || 1;
  let detail = "";
  try {
    const stats = await peer.getStats();
    const pair = findSelectedPair(stats);
    if (!pair) {
      if (attempt < ROUTE_TRIES) {
        setTimeout(() => reportRoute(peer, attempt + 1), ROUTE_RETRY_MS);
        return;
      }
      detail = "phone connected, but getStats reported no candidate pair";
    } else {
      const local = stats.get(pair.localCandidateId) || {};
      const remote = stats.get(pair.remoteCandidateId) || {};
      detail = "phone " + (local.candidateType || "?") + "/" +
        (local.protocol || "?") + " -> " + (remote.candidateType || "?") +
        (pair.currentRoundTripTime != null
          ? " rtt " + Math.round(pair.currentRoundTripTime * 1000) + "ms" : "");
      say(local.candidateType === "relay" ? "Connected (relayed)" : "Connected", true);
    }
  } catch (err) {
    detail = "phone could not read stats: " + ((err && err.message) || err);
  }
  send({ type: "route", detail });
}

// What the outgoing video may cost, and what gives first when the link cannot
// carry it. `balanced` is the requirement's "reduce quality rather than
// freeze"; the default holds frame rate and destroys resolution instead.
const MAX_BITRATE = 2000000;

async function tuneVideoSender(peer) {
  const sender = peer.getSenders().find((s) => s.track && s.track.kind === "video");
  if (!sender || !sender.getParameters) return;
  try {
    const parameters = sender.getParameters();
    if (!parameters.encodings || !parameters.encodings.length) {
      parameters.encodings = [{}];
    }
    parameters.encodings[0].maxBitrate = MAX_BITRATE;
    parameters.degradationPreference = "balanced";
    await sender.setParameters(parameters);
  } catch (err) { console.warn("could not set sender parameters", err); }
}

function say(text, up) {
  el("banner-text").textContent = text;
  el("banner").classList.toggle("up", !!up);
}

async function dial() {
  el("dial").disabled = true;
  note("Asking for the camera…");
  try {
    // Media first, and deliberately before ringing. If the person refuses
    // permission — or this is not a secure context — the call must fail here,
    // with nothing having rung on the Pi and nothing having opened the Brio.
    local = await openMedia();
  } catch (err) {
    el("dial").disabled = false;
    note(err && err.name === "NotAllowedError"
      ? "Camera and microphone permission is needed to call."
      : "No camera or microphone available on this phone.", true);
    return;
  }

  note("Calling…");
  let payload;
  try {
    const response = await api("/call/v1/ring", { method: "POST", body: "{}" });
    payload = await response.json();
    if (!response.ok || !payload.ok) throw new Error(payload.error || "AIPI5 refused the call.");
  } catch (err) {
    stopLocal();
    el("dial").disabled = false;
    note(err.message || "Could not reach AIPI5.", true);
    return;
  }

  startSession(payload.session, payload.ice_servers || []);
}

// Everything between "we have a session and a camera" and "a call is running".
// Shared, because the two ways in — dialling the Pi, and answering it — differ
// only in how the session was obtained and who offers first.
function startSession(sess, ice) {
  session = sess;
  iceServers = ice || [];
  cursor = 0;
  pendingCandidates = [];

  el("files").classList.remove("on");
  el("home").style.display = "none";
  el("incoming").classList.remove("on");
  el("call").classList.add("on");
  el("self").srcObject = local;
  say("Calling…", false);

  pc = buildPeer();
  for (const track of local.getTracks()) pc.addTrack(track, local);
  tuneVideoSender(pc);

  poll();
}

// The Pi picked up. The phone is the caller, so it makes the offer — and only
// now, so that the answer comes back from a page that already has its camera.
async function makeOffer() {
  const offer = await pc.createOffer({ offerToReceiveAudio: true,
                                       offerToReceiveVideo: true });
  await pc.setLocalDescription(offer);
  send({ type: "offer", sdp: pc.localDescription.sdp });
}

async function handle(message) {
  if (!pc && message.type !== "bye") return;
  if (message.type === "answered") {
    say("Connecting…", false);
    await makeOffer();
  } else if (message.type === "answer") {
    await pc.setRemoteDescription({ type: "answer", sdp: message.sdp });
    for (const candidate of pendingCandidates) {
      await pc.addIceCandidate(candidate).catch(() => {});
    }
    pendingCandidates = [];
  } else if (message.type === "ice" && message.candidate) {
    if (pc.remoteDescription && pc.remoteDescription.type) {
      await pc.addIceCandidate(message.candidate).catch(() => {});
    } else {
      pendingCandidates.push(message.candidate);
    }
  } else if (message.type === "bye") {
    endCall(message.reason || "the other side hung up", true);
  }
}

async function poll() {
  if (polling) return;
  polling = true;
  while (session) {
    let payload;
    try {
      const response = await api("/call/v1/poll?since=" + cursor);
      payload = await response.json();
    } catch (err) {
      if (!session) break;
      // A dropped poll is the normal shape of a phone changing network. Wait a
      // moment and ask again rather than ending a call that may be fine.
      say("Reconnecting…", false);
      await new Promise((r) => setTimeout(r, 1500));
      continue;
    }
    if (typeof payload.cursor === "number") cursor = payload.cursor;
    for (const message of payload.messages || []) {
      try { await handle(message); } catch (err) { console.warn(err); }
    }
  }
  polling = false;
}

function stopLocal() {
  if (!local) return;
  // Stopping the tracks is what turns the phone's camera light off. Dropping
  // the reference alone leaves it on until the tab is closed.
  for (const track of local.getTracks()) track.stop();
  local = null;
}

function endCall(why, remote) {
  const had = session;
  session = "";
  recovering = false;
  if (recoveryTimer) { clearTimeout(recoveryTimer); recoveryTimer = null; }
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  stopLocal();
  el("remote").srcObject = null;
  el("self").srcObject = null;
  el("call").classList.remove("on");
  el("home").style.display = "";
  el("dial").disabled = false;
  el("mic").classList.remove("off");
  el("cam").classList.remove("off");
  note(remote ? (why || "Call ended.") : "");
  if (had && !remote) {
    // The reason travels with it. Without this the server logged every ending
    // as "the phone hung up", so a call the recovery timeout gave up on and a
    // call somebody deliberately ended were indistinguishable in the journal —
    // which is exactly the distinction you want when reading back a call that
    // dropped on a bad link.
    api("/call/v1/bye", { method: "POST",
                          body: JSON.stringify({ session: had, reason: why || "" }) })
      .catch(() => {});
  }
}

el("dial").addEventListener("click", dial);

el("accept").addEventListener("click", acceptIncoming);

el("decline").addEventListener("click", () => {
  const had = incomingSession;
  showIncoming("", false);
  note("Call declined.");
  if (had) {
    api("/call/v1/bye", { method: "POST",
      body: JSON.stringify({ session: had, reason: "declined on the phone" }) })
      .catch(() => {});
  }
});

// Permission has to be asked inside a tap. Doing it on load is refused by iOS
// and can be remembered as a denial, which is worse than not asking.
el("allow-ring").addEventListener("click", async () => {
  el("allow-ring").disabled = true;
  const outcome = await subscribeForRings();
  el("allow-ring").disabled = false;
  if (outcome.ok) {
    el("allow-ring").hidden = true;
    note("AIPI5 can ring this phone now.");
  } else {
    note(outcome.why, true);
  }
});

// The service worker telling us a notification was tapped. Faster than waiting
// for the idle poll, and it carries the session so there is no guessing which
// call was meant.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type === "answer-call" && !session) {
      showIncoming(data.session || incomingSession, true);
    }
  });
}

// While idle, ask occasionally whether the Pi is ringing. Slow on purpose: the
// push is the mechanism, and this is the backstop for a push that was dropped,
// delayed, or never permitted.
async function idleCheck() {
  if (session || !token) return;
  try {
    const response = await api("/call/v1/state");
    const state = await response.json();
    if (state.state === "calling" && state.session) {
      showIncoming(state.session, true);
    } else if (incomingSession && state.state !== "calling") {
      // Stopped ringing — timed out, or answered somewhere else.
      showIncoming("", false);
    }
    filesFromState(state);
  } catch (err) { /* offline; the next tick tries again */ }
}
el("hang").addEventListener("click", () => endCall("you hung up"));

el("mic").addEventListener("click", () => {
  if (!local) return;
  const track = local.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  el("mic").classList.toggle("off", !track.enabled);
  el("mic").setAttribute("aria-label",
    track.enabled ? "Mute the microphone" : "Unmute the microphone");
});

el("cam").addEventListener("click", () => {
  if (!local) return;
  const track = local.getVideoTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  el("cam").classList.toggle("off", !track.enabled);
  el("cam").setAttribute("aria-label",
    track.enabled ? "Turn the camera off" : "Turn the camera on");
});

// Closing the tab or locking the phone mid-call must hang up, or the Pi holds
// the Brio open waiting for a peer that is gone. `pagehide` rather than
// `unload`, which iOS Safari does not reliably fire; `keepalive` so the
// request survives the page going away.
window.addEventListener("pagehide", () => {
  if (!session) return;
  try {
    fetch("/call/v1/bye", {
      method: "POST", keepalive: true,
      headers: { "Authorization": "Bearer " + token,
                 "Content-Type": "application/json" },
      body: JSON.stringify({ session }),
    });
  } catch (e) { /* going away anyway */ }
});

// ── startup ─────────────────────────────────────────────────────────

(async function ready() {
  if (!token) {
    // Most often this is the Home Screen app launched from a shortcut saved
    // before the token was in the address — iOS gives an installed app its own
    // storage, so it cannot see what Safari kept. Re-opening the pairing link
    // and re-adding fixes it, so say that rather than naming a script that
    // lives on a machine the reader is not sitting at.
    el("who").textContent = "This phone is not paired.";
    note("Open the pairing link again in Safari, then Share → Add to Home "
         + "Screen. The shortcut has to be made from the link itself.", true);
    return;
  }
  if (!navigator.mediaDevices || !window.RTCPeerConnection) {
    el("who").textContent = "This browser cannot make calls.";
    note("A secure connection (https) is required — check the address.", true);
    return;
  }
  try {
    const response = await api("/call/v1/state");
    const state = await response.json();
    el("who").textContent = "This phone is authorised to call AIPI5.";
    if (state.state && state.state !== "idle") {
      note("AIPI5 is already on a call.");
    }
    el("dial").disabled = false;

    // Offer to be rung, if this phone is not set up for it yet. Only in an
    // installed app: iOS refuses Web Push in a plain Safari tab, and offering
    // a button that cannot work is worse than not offering it.
    //
    // **Whether it is set up is the Pi's answer, not this phone's.** iOS keeps
    // a push subscription of its own accord, and it survives things that the
    // Pi's copy does not — a re-pairing, a restore, a subscription whose POST
    // never arrived. Reading the local one as proof hid the button from the
    // only person who could have fixed it, on a phone the Pi could not ring:
    // both ends silently disagreeing, with no way in from either.
    const installed = window.navigator.standalone === true
      || window.matchMedia("(display-mode: standalone)").matches;
    await registerWorker();
    if (installed && !state.can_ring && "Notification" in window) {
      // A subscription this phone already holds is re-offered without a tap.
      // No permission prompt is involved — it was granted when the
      // subscription was made — so there is nothing to ask.
      let repaired = false;
      try {
        const already = swReg && await swReg.pushManager.getSubscription();
        if (already) {
          const response = await api("/call/v1/subscribe", {
            method: "POST",
            body: JSON.stringify({ subscription: already.toJSON() }),
          });
          repaired = (await response.json()).ok === true;
          if (repaired) note("AIPI5 can ring this phone now.");
        }
      } catch (err) {
        await reportPush("could not re-offer an existing subscription: "
                         + ((err && err.message) || err));
      }
      el("allow-ring").hidden = repaired;
    }
    if (!installed && !state.can_ring) {
      // In a browser tab there is no button to offer — iOS allows Web Push
      // only to an installed app — so say why, on the screen of the person who
      // is wondering where it went. Saying nothing is what sent somebody round
      // this loop three times: the page looked perfectly healthy, because for
      // calling *out* it was.
      el("who").textContent =
        "This phone can call AIPI5, but AIPI5 cannot ring it.";
      note("To be rung, this page has to be installed: open this same link in "
           + "SAFARI (long-press it → Open in Safari), then Share → Add to "
           + "Home Screen, and launch it from the new icon.");
    }
    if (idleTimer) clearInterval(idleTimer);
    idleTimer = setInterval(idleCheck, 4000);
    idleCheck();
  } catch (err) {
    el("who").textContent = "Could not reach AIPI5.";
    note(err.message || "Check that you are on the same network.", true);
  }
})();
</script>
</body>
</html>
