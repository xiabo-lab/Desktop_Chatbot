<?xml version="1.0" encoding="UTF-8"?>
<!--
  The launcher icon. Scalable rather than a PNG because the Pi's desktop, its
  taskbar and its applications menu all ask for different sizes, and one SVG
  answers all three without a set of rasters to keep in step.

  Drawn on its own rounded tile rather than as a bare glyph: this sits on a
  photographic wallpaper, and a flat shape with no ground behind it disappears
  against the light half of it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2530"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none"
        stroke="#2b3542" stroke-width="1"/>

  <!-- The microphone capsule and its stand. -->
  <rect x="26" y="14" width="12" height="21" rx="6" fill="#4da3ff"/>
  <path d="M20 30a12 12 0 0 0 24 0" fill="none" stroke="#4da3ff"
        stroke-width="3" stroke-linecap="round"/>
  <path d="M32 42v6" fill="none" stroke="#4da3ff" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Two arcs for "it answers", in the warm accent the UI uses for thinking. -->
  <path d="M48 22a14 14 0 0 1 0 20" fill="none" stroke="#ffb454"
        stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M53 17a21 21 0 0 1 0 30" fill="none" stroke="#ffb454"
        stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
